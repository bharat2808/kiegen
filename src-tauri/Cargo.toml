[package]
name = "kiegen"
version = "0.1.0"
description = "Speak any selected text, from anywhere in macOS"
authors = ["kiegen contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kiegen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Selection capture + synthetic key events.
# Invariant: every entry here is MIT OR Apache-2.0 compatible. No GPL. See docs/DESIGN.md §5.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10.1"
accessibility-sys = "0.2.0"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSPasteboardItem", "NSSpeechSynthesizer"] }
libc = "0.2"
# Weight downloads. Both are already in the tree via `ort-sys`, so declaring them adds no
# crates; `default-features` matches what ort-sys already enabled (`rustls`, `gzip`).
ureq = "3.4"
sha2 = "0.10"
# ONNX Runtime bindings for the opt-in Kokoro engine. `download-binaries` vendors the
# runtime at build time so the engine works out of the box; switching to `load-dynamic`
# would keep the base bundle small and move the runtime onto Kokoro's install path.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
